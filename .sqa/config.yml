        commands:
        - /usr/bin/env sh .sqa/script.cream_mischievous_sphinx.sh
        container: qc.sty_arctic_witty_seal
  QC.Ver:
    repos:
      github.com/cessda/eosc-node-endpoint get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.flax_motivated_squirrel.sh
        container: qc.ver_ecru_diligent_ibex
