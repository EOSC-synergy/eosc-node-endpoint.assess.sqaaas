config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/cessda/eosc-node-endpoint:
      branch: main
      repo: https://github.com/cessda/eosc-node-endpoint
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/cessda/eosc-node-endpoint git:
        commands:
        - /usr/bin/env sh .sqa/script.turquoise_brilliant_anaconda.sh
        container: qc.acc_sand_trustworthy_squirrel
  QC.Doc:
    repos:
      github.com/cessda/eosc-node-endpoint find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.ash_compassionate_skunk.sh
        container: qc.doc_fandango_sarcastic_goat
      github.com/cessda/eosc-node-endpoint git:
        commands:
        - /usr/bin/env sh .sqa/script.saffron_unique_crocodile.sh
        container: qc.doc_caramel_lively_quoll
      github.com/cessda/eosc-node-endpoint markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.butter_melancholy_serval.sh
        container: qc.doc_mint_attentive_piranha
  QC.Lic:
    repos:
      github.com/cessda/eosc-node-endpoint licensee:
        commands:
        - /usr/bin/env sh .sqa/script.clove_peaceful_grizzly.sh
        container: qc.lic_cinnabar_dramatic_thrush
