    repos:
      github.com/cessda/eosc-node-endpoint find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.claret_understanding_dugong.sh
        container: qc.doc_seafoam_adaptable_rattlesnake
      github.com/cessda/eosc-node-endpoint git:
        commands:
        - /usr/bin/env sh .sqa/script.glacier_positive_osprey.sh
